name: Cache independent evaluation road map
on:
  push:
    branches: [research/imu-gnss-integration]
    paths: [.github/workflows/fetch-evaluation-map.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Download bounded independent road extract
        run: |
          mkdir -p map-artifact
          python3 - <<'PY'
          import datetime,gzip,hashlib,json,pathlib,urllib.request,urllib.parse
          bounds=[43.462,-79.744,43.486,-79.676]
          query='[out:json][timeout:60];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|service|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"]('+','.join(map(str,bounds))+');(._;>;);out body;'
          errors=[]
          for endpoint in ['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter']:
              try:
                  req=urllib.request.Request(endpoint,data=urllib.parse.urlencode({'data':query}).encode(),headers={'User-Agent':'navigation_research RouteFusion reproducible evaluation'})
                  with urllib.request.urlopen(req,timeout=90) as response: raw=response.read()
                  doc=json.loads(raw)
                  if 'remark' in doc or not any(e['type']=='way' for e in doc['elements']): raise ValueError('Incomplete or empty map response')
                  pathlib.Path('map-artifact/osm-roads.json.gz').write_bytes(gzip.compress(raw,mtime=0))
                  meta={'bbox_south_west_north_east':bounds,'query':query,'endpoint':endpoint,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'response_sha256':hashlib.sha256(raw).hexdigest(),'osm_base':doc.get('osm3s',{}),'attribution':'OpenStreetMap contributors','license':'ODbL 1.0','purpose':'Independent geometry, not derived from the evaluation reference trajectory','elements':len(doc['elements']),'earlier_errors':errors}
                  pathlib.Path('map-artifact/provenance.json').write_text(json.dumps(meta,indent=2)+'\n')
                  print(json.dumps(meta,indent=2));break
              except Exception as exc: errors.append(str(exc))
          else: raise RuntimeError(errors)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-road-map
          path: map-artifact
          retention-days: 14
