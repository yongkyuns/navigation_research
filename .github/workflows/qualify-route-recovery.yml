name: Qualify map-only position recovery
on:
  pull_request:
    paths: ['integration/imu_gnss/**', '.github/workflows/qualify-route-recovery.yml']
  push:
    branches: [main]
    paths: ['integration/imu_gnss/**', '.github/workflows/qualify-route-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yongkyuns/imu_gnss_fusion
          ref: 8a34212c7befe30f8d3eae4ad708cc0dcd4aa0d6
          path: .cache/upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Build original native library without GNSS-bias extension
        run: |
          set -euo pipefail
          python -m pip install -r requirements-reproduce.txt
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.90.0
          export PATH="$HOME/.cargo/bin:$PATH"
          python integration/imu_gnss/prepare_native.py --upstream .cache/upstream --output .cache/native
          mkdir -p runs/route-recovery-build
          cargo test --manifest-path .cache/native/Cargo.toml --workspace --locked 2>&1 | tee runs/route-recovery-build/rust-tests.txt
          cargo build --manifest-path .cache/native/Cargo.toml --release --locked -p routefusion_native_bridge
          cp .cache/native/source-provenance.json runs/route-recovery-build/
          rustc -Vv > runs/route-recovery-build/rustc.txt
      - name: Check original tests and recovery safety invariants
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/routefusion_prototype:$PWD/integration/imu_gnss"
          export ROUTEFUSION_NATIVE_LIBRARY="$PWD/.cache/native/target/release/libroutefusion_native_bridge.so"
          export ROUTEFUSION_DATASETS="$PWD/.cache/upstream/web/datasets"
          export ROUTE_LATCH_MAP_CACHE="$PWD/integration/imu_gnss/map_cache"
          python -m pytest -q integration/imu_gnss/tests integration/imu_gnss/route_latch/test_route_latch.py integration/imu_gnss/route_recovery_tests --junitxml=runs/route-recovery-build/tests.xml | tee runs/route-recovery-build/tests.txt
      - name: Compare native trajectories and full clean recordings
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python integration/imu_gnss/evaluate_relocalization.py \
            --library "$PWD/.cache/native/target/release/libroutefusion_native_bridge.so" \
            --datasets "$PWD/.cache/upstream/web/datasets" \
            --map-cache "$PWD/integration/imu_gnss/map_cache" \
            --output runs/route-recovery --tests runs/route-recovery-build/tests.xml
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('runs/route-recovery')
          (root/'SHA256SUMS.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: map-only-position-recovery-${{ github.run_id }}
          path: |
            runs/route-recovery
            runs/route-recovery-build
          retention-days: 30
          if-no-files-found: error
