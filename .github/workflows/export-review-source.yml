name: Export intersection review source
on:
  push:
    branches: [research/imu-gnss-integration]
    paths: [.github/workflows/export-review-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Package implementation and review metadata
        run: |
          mkdir -p runs
          git rev-parse HEAD > runs/source-commit.txt
          tar -czf runs/review-source.tar.gz integration/imu_gnss/*.py integration/imu_gnss/tests integration/imu_gnss/rust_bridge integration/imu_gnss/*.md integration/imu_gnss/Cargo.lock integration/imu_gnss/upstream-source-sha256.json .github/workflows README.md scripts requirements-reproduce.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intersection-review-source
          path: runs
          retention-days: 7
