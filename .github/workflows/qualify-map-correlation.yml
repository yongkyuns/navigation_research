name: Qualify correlated road-map error reference
on:
  pull_request:
    paths:
      - integration/imu_gnss/map_correlation.py
      - integration/imu_gnss/evaluate_map_correlation.py
      - integration/imu_gnss/map_correlation_tests/**
      - integration/imu_gnss/map_correlation_evidence.json
      - integration/imu_gnss/MAP_CORRELATION.md
      - .github/workflows/qualify-map-correlation.yml
  push:
    branches: [main]
    paths:
      - integration/imu_gnss/map_correlation.py
      - integration/imu_gnss/evaluate_map_correlation.py
      - integration/imu_gnss/map_correlation_tests/**
      - integration/imu_gnss/map_correlation_evidence.json
      - .github/workflows/qualify-map-correlation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install mathematical test dependencies
        run: python -m pip install numpy==2.3.5 pytest==9.0.2
      - name: Verify reference mathematics
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/integration/imu_gnss"
          mkdir -p runs/map-correlation
          python -m pytest -q integration/imu_gnss/map_correlation_tests --junitxml=runs/map-correlation/tests.xml | tee runs/map-correlation/tests.txt
      - name: Reproduce deterministic synthetic comparison
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/integration/imu_gnss"
          python integration/imu_gnss/evaluate_map_correlation.py --trials 80 --seconds 45 --output runs/map-correlation/simulation.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('runs/map-correlation/simulation.json').read_text())
          b=json.loads(Path('integration/imu_gnss/map_correlation_evidence.json').read_text())
          assert a['seed']==b['seed'] and a['trials']==b['trials'] and a['seconds']==b['seconds']
          assert a['gaussian_assumptions']==b['gaussian_assumptions']
          for label, original in b['results'].items():
              current=a['results'][label]
              assert current['map_updates_per_trial']==original['map_updates_per_trial']
              for k,v in original.items():
                  if isinstance(v,float):
                      assert abs(current[k]-v) <= 1e-6*max(1,abs(v)), (label,k,current[k],v)
          assert a['results']['naive independent centerline']['mean_position_nees']>50
          assert a['results']['correlated Schmidt map offset']['mean_position_nees']<3
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: map-correlation-reference-${{ github.run_id }}
          path: runs/map-correlation
          retention-days: 30
          if-no-files-found: error
