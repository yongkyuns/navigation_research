name: Import original evidence
on:
  push:
    branches: [research/routefusion-initial-import]
    paths:
      - scripts/restore_original_evidence.py
      - provenance/original-artifacts.json
      - .github/workflows/import-evidence.yml
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'yongkyuns/navigation_research' && github.ref == 'refs/heads/research/routefusion-initial-import'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install captured numerical and plotting versions
        run: python -m pip install -r routefusion_prototype/requirements-tested.txt matplotlib==3.10.8 Pillow==12.3.0 -e ./routefusion_prototype
      - name: Restore and verify all original snapshot bytes
        run: python scripts/restore_original_evidence.py
      - name: Commit verified evidence to the import branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- routefusion_prototype/results routefusion_prototype/SHA256SUMS.txt routefusion_research_and_design.md artifacts/routefusion_prototype.zip provenance/IMPORT_VERIFICATION.json
          git diff --cached --quiet || git commit -m 'Preserve checksum-verified original RouteFusion research evidence'
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Preserve current verification logs separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-verification-${{ github.run_id }}
          path: runs/import-verification
          if-no-files-found: ignore
