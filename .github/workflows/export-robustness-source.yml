name: Export robustness source
on:
  push:
    branches: [research/urban-bias-robustness]
    paths: [.github/workflows/export-robustness-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export source without historical or private dataset duplication
        run: |
          mkdir source-artifact
          git archive --format=tar.gz --output=source-artifact/research-source.tar.gz HEAD integration routefusion_prototype/routefusion routefusion_prototype/tests routefusion_prototype/pyproject.toml .github/workflows requirements-reproduce.txt README.md
          git rev-parse HEAD > source-artifact/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robustness-source
          path: source-artifact
          retention-days: 7
