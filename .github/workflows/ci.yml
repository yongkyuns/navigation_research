name: Validate research snapshot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install reference environment
        run: python -m pip install -r routefusion_prototype/requirements-tested.txt matplotlib==3.10.8 Pillow==12.3.0 -e ./routefusion_prototype
      - name: Verify the archived project and reproduce the evaluation
        run: python scripts/reproduce.py --output runs/ci
      - name: Upload fresh validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-validation-${{ github.run_id }}
          path: runs/ci
          if-no-files-found: ignore
