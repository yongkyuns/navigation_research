name: Check original numeric environment
on:
  push:
    branches: [research/routefusion-initial-import]
    paths: [.github/workflows/import-numeric-environment.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Inspect CPU and install numerical environment
        run: |
          lscpu
          ldd --version | head -1
          python -m pip install -r routefusion_prototype/requirements-tested.txt matplotlib==3.10.8 Pillow==12.3.0 threadpoolctl -e ./routefusion_prototype
          python -c "import numpy,threadpoolctl; print(threadpoolctl.threadpool_info()); numpy.show_runtime()"
      - name: Restore captured source newline and match original BLAS dispatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('routefusion_prototype/sources.json')
          data=p.read_bytes()
          if hashlib.sha256(data).hexdigest() == '54dc6ed16b3f9a467aaa9c3b125bf344e7293c777fe47c3e18cb25a1d41fb6e0':
              p.write_bytes(data+b'\n')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'b6ef9c01879502ad6e797dc673b76f54da6473195f316a15ac026e4a96dbaca9'
          PY
          grep -q avx512f /proc/cpuinfo
          export OPENBLAS_CORETYPE=SkylakeX
          python -c "import numpy,threadpoolctl; print(threadpoolctl.threadpool_info())"
          python scripts/restore_original_evidence.py
      - name: Publish only checksum-identical archived evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- routefusion_prototype/sources.json routefusion_prototype/results routefusion_prototype/SHA256SUMS.txt routefusion_research_and_design.md artifacts/routefusion_prototype.zip provenance/IMPORT_VERIFICATION.json
          git commit -m 'Preserve checksum-verified original research artifacts'
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-environment-${{ github.run_id }}
          path: runs/import-verification
          if-no-files-found: ignore
