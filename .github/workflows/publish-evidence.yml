name: Publish labelled research evidence
on:
  push:
    branches: [research/routefusion-initial-import]
    paths: [.github/workflows/publish-evidence.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'yongkyuns/navigation_research' && github.ref == 'refs/heads/research/routefusion-initial-import'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install the reference environment
        run: python -m pip install -r requirements-reproduce.txt -e ./routefusion_prototype
      - name: Preserve originals and validate cross-CPU reproduction
        run: |
          python scripts/publish_evidence.py
          python scripts/verify_snapshot.py
      - name: Commit verified publication without overwriting other work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- routefusion_prototype/sources.json routefusion_prototype/results routefusion_prototype/SHA256SUMS.txt routefusion_research_and_design.md artifacts/routefusion_prototype.zip provenance
          git commit -m 'Publish original numerical records and validated reproduction artifacts'
          git push origin HEAD:research/routefusion-initial-import
      - name: Preserve fresh publication logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-verification-${{ github.run_id }}
          path: runs/import-verification
          if-no-files-found: ignore
